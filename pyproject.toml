[project]
name = "astria-config"
version = "0.2.1"
description = "Konfigurasi dan katalog; rahasia tulis-saja."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "astria-common[otel]",
    "astria-contracts",
    "cryptography>=45",
    "pyyaml>=6.0",
]

[project.scripts]
astria-config = "astria_config.__main__:main"
config = "astria_config.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "anyio>=4.11",
    "ruff==0.17.4",
]

# Dependensi privat lewat tag git (keputusan pemilik infra#3). Naikkan tag di sini, lalu `uv lock`.
[tool.uv.sources]
astria-common = { git = "https://github.com/yusronMu77/triase-dfir-common", tag = "v0.2.3" }
astria-contracts = { git = "https://github.com/yusronMu77/triase-dfir-contracts", tag = "v0.4.0" }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astria_config"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W", "ASYNC"]
ignore = ["S101", "S104", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["astria_config"]

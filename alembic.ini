# Alembic untuk pengembang: `alembic -c alembic.ini heads`, `alembic -c alembic.ini revision -m "..."`.
# URL basis data dari ASTRIA_DATABASE_URL (lihat src/astria_config/migrations/env.py). Start layanan memakai
# `astria-config migrate` (astria_config.migrate.ensure_schema), bukan berkas ini.
[alembic]
script_location = src/astria_config/migrations
file_template = %%(rev)s_%%(slug)s

